# SIMTIS Finance — environnement de développement.
# Démarrage : `docker compose up --build`  (aucun fichier .env n'est requis).
# Les valeurs par défaut ci-dessous sont valables pour le développement uniquement.
name: simtis-finance

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simtis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simtis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-simtis}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 5434 côté poste : 5432 et 5433 sont souvent déjà pris (PostgreSQL local, autres projets Docker).
      # Les conteneurs, eux, se parlent toujours sur db:5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # À chaque démarrage : schéma à jour (migrations), données de référence (seeds, sans jamais écraser
    # l'existant), puis l'API. Les données de démonstration se chargent à part :
    #   docker compose run --rm backend python -m app.seeds --demo
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m app.seeds &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-simtis}:${POSTGRES_PASSWORD:-simtis_dev_password}@db:5432/${POSTGRES_DB:-simtis}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Rechargement à chaud fiable sur les dossiers montés depuis Windows
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json,urllib.request as u; d=json.load(u.urlopen('http://localhost:8000/api/health')); raise SystemExit(0 if d['status']=='ok' else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    # Mode webpack : Turbopack ne détecte pas les modifications de fichiers dans un dossier monté depuis Windows.
    command: ["npm", "run", "dev", "--", "--webpack", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      # Rechargement à chaud fiable sur les dossiers montés depuis Windows
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules et .next restent ceux du conteneur (Linux), pas ceux de l'hôte (Windows)
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s

volumes:
  db_data:
  frontend_node_modules:
  frontend_next:
