# SIMTIS Finance — production (22/10/2026) : HTTPS par Caddy, images compilées, rien d'autre que les
# ports 80 et 443 ouverts au réseau.
#   docker compose -f docker-compose.prod.yml up -d --build --wait
# Même nom de projet et même volume de base que docker-compose.yml : les données sont conservées.
# Réglages dans .env (voir .env.example, partie « Production »).
name: simtis-finance

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simtis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-simtis}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # production : cookie de session « Secure » (HTTPS seulement). development en HTTP seul (Caddyfile.http)
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-simtis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simtis}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS manquant dans .env (ex. https://10.77.77.11)}
      # Refusé au démarrage s'il est absent ou trop court (APP_ENV=production)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      MAX_LOGIN_FAILURES: ${MAX_LOGIN_FAILURES:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json,urllib.request as u; d=json.load(u.urlopen('http://localhost:8000/api/health')); raise SystemExit(0 if d['status']=='ok' else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # L'ancienne adresse http://IP:3000 reste valable (22/10/2026)
      - "3000:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      # Caddyfile (HTTPS) ou Caddyfile.http (HTTP seul, en attendant un nom de domaine)
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      # Autorité de certification interne et certificats : à garder (sinon nouveau certificat racine)
      - caddy_data:/data
      - caddy_config:/config
      # Page « Mise à jour en cours » servie pendant un redémarrage (28/10/2026)
      - ./deploy/maintenance.html:/srv/maintenance/maintenance.html:ro
    # Pas de depends_on (28/10/2026) : Caddy attendait que le frontend soit en bonne santé, donc Docker
    # l'arrêtait à chaque déploiement et les ports 80 / 3000 refusaient la connexion. Il reste en marche
    # et sert la page de maintenance tant que le frontend ou l'API redémarrent.

volumes:
  db_data:
  caddy_data:
  caddy_config:
