[project]
name = "simtis-backend"
version = "0.1.0"
description = "API SIMTIS Finance (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 (ligne trop longue) : `ruff format` gère déjà le code ; il ne recoupe ni les docstrings ni les commentaires
ignore = ["E501"]

[tool.ruff.lint.isort]
# Le dossier local `alembic/` (migrations) porte le même nom que la bibliothèque
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en valeur par défaut est l'usage normal de FastAPI
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "app.api.deps.require_permission",
]
